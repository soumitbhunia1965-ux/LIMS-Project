<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Sample - LIMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h4 class="mb-3">Log New Sample</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label font-monospace">Barcode / Sample ID</label>
                <input type="text" name="barcode" class="form-control" placeholder="e.g. SMP-2026-001" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Sample Type</label>
                <input type="text" name="sample_type" class="form-control" placeholder="e.g. Raw Material, Finished Product" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Batch Number</label>
                <input type="text" name="batch_number" class="form-control" placeholder="e.g. BATCH-7701" required>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save & Register</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
