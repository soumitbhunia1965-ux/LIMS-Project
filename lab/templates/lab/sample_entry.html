{% extends "lab/base.html" %}

{% block content %}
<div class="container" style="max-width: 900px;">
    <div class="card shadow-sm border-0 p-4 border-top border-4 border-primary mt-2">
        <h4 class="fw-bold mb-3" style="color: #071527;">
            <i class="bi bi-eyedropper text-primary me-2"></i>Accession Laboratory Sample
        </h4>
        <p class="text-muted small">
            Register samples with full product/material master linkage, storage destination, and specialized environmental/water metadata per cGMP.
        </p>
        <hr>

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Sample Barcode / Tracking ID *</label>
                    <input type="text" name="barcode" class="form-control font-monospace" placeholder="e.g. SAM-2026-0042" required autofocus>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Internal Batch / Lot Number *</label>
                    <input type="text" name="batch_number" class="form-control" placeholder="e.g. BN-PARA-2026-01" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Sample Classification *</label>
                    <select name="sample_type" id="sampleTypeSelect" class="form-select" required>
                        <option value="FINISHED_PRODUCT">Finished Product</option>
                        <option value="RAW_MATERIAL">Raw Material / API</option>
                        <option value="PACKAGING">Packaging Material</option>
                        <option value="IN_PROCESS">In-Process Control (IPC)</option>
                        <option value="WATER">Pharmaceutical Water</option>
                        <option value="ENVIRONMENTAL">Environmental Monitoring (EM)</option>
                        <option value="STABILITY">Stability Protocol Pull</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Testing Purpose *</label>
                    <select name="purpose" class="form-select" required>
                        <option value="RELEASE">Commercial Batch Release</option>
                        <option value="RETEST">Periodic Retest</option>
                        <option value="INVESTIGATION">OOS / Deviation Investigation</option>
                        <option value="VALIDATION">Validation Protocol</option>
                        <option value="SURVEILLANCE">Routine Monitoring</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Testing Priority</label>
                    <select name="priority" class="form-select">
                        <option value="NORMAL">Normal (Routine)</option>
                        <option value="URGENT">Urgent (Priority)</option>
                        <option value="CRITICAL">Critical (Line Clearance)</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Target Product Master (For FG)</label>
                    <select name="product_id" class="form-select">
                        <option value="">-- None / Select Product --</option>
                        {% for p in products %}
                            <option value="{{ p.id }}">{{ p.code }} - {{ p.brand_name }} ({{ p.strength }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Target Raw Material Master (For API/RM)</label>
                    <select name="material_id" class="form-select">
                        <option value="">-- None / Select Material --</option>
                        {% for m in materials %}
                            <option value="{{ m.id }}">{{ m.code }} - {{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Applicable Specification Binder</label>
                    <select name="specification_id" class="form-select">
                        <option value="">-- Auto-Resolve via Master Data --</option>
                        {% for spec in specs %}
                            <option value="{{ spec.id }}">{{ spec.spec_number }} - {{ spec.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Physical Storage Destination</label>
                    <select name="location_id" class="form-select">
                        {% for loc in locations %}
                            <option value="{{ loc.id }}">{{ loc.location_code }} - {{ loc.description }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Sample Quantity Collected</label>
                    <input type="number" step="any" name="quantity_collected" class="form-control" value="1.0">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Quantity Unit</label>
                    <input type="text" name="quantity_unit" class="form-control" value="Units / Bottles">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Analytical Due Date</label>
                    <input type="date" name="due_date" class="form-control">
                </div>
            </div>

            <!-- Conditional Context for Water Testing -->
            <div id="waterContextBox" class="p-3 bg-light rounded border mb-3 d-none">
                <h6 class="fw-bold text-info"><i class="bi bi-droplet-fill me-1"></i>Water Testing Context</h6>
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label small">Sampling Point ID</label>
                        <input type="text" name="water_point" class="form-control form-control-sm" placeholder="e.g. Loop 1 Point 12">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Water Grade</label>
                        <select name="water_grade" class="form-select form-select-sm">
                            <option value="PURIFIED">Purified Water (USP/EP)</option>
                            <option value="WFI">Water for Injection (WFI)</option>
                            <option value="PURE_STEAM">Pure Steam Condensate</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Flush Time (Minutes)</label>
                        <input type="number" name="flush_minutes" class="form-control form-control-sm" value="5">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'sample_module' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary fw-bold px-4">Register & Accession Sample</button>
            </div>
        </form>
    </div>
</div>

<script>
    const typeSelect = document.getElementById('sampleTypeSelect');
    const waterBox = document.getElementById('waterContextBox');

    typeSelect.addEventListener('change', function() {
        if (this.value === 'WATER') {
            waterBox.classList.remove('d-none');
        } else {
            waterBox.classList.add('d-none');
        }
    });
</script>
{% endblock %}
