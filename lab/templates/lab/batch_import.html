<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Batch Instrument Import - LIMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h4>Batch Instrument Results Import</h4>
        <p class="text-muted">Upload CSV or Excel output from HPLC, GC, or Empower instruments.</p>
        <hr>
        
        <div class="alert alert-info">
            <strong>Expected File Format:</strong>
            <table class="table table-sm table-bordered mt-2 mb-0 bg-white">
                <thead><tr><th>barcode</th><th>test</th><th>value</th></tr></thead>
                <tbody><tr><td>SAM-001</td><td>Assay</td><td>99.5</td></tr></tbody>
            </table>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Select CSV or .xlsx File</label>
                <input type="file" name="instrument_file" class="form-control" accept=".csv, .xlsx" required>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
                <button type="submit" class="btn btn-primary">Process and Import</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
