<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}QC Laboratory Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .nav-link.active { font-weight: bold; border-bottom: 2px solid #0d6efd; color: #fff !important; }
    </style>
</head>
<body class="bg-light">

<!-- Top Navigation Bar for All Modules -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm mb-4">
    <a class="navbar-brand font-monospace me-4" href="{% url 'main_hub' %}">
        <i class="bi bi-boxes me-2"></i>QC LIMS Portal
    </a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'main_hub' %}active{% endif %}" href="{% url 'main_hub' %}">
                    <i class="bi bi-speedometer2 me-1"></i>Portal Hub
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'sample' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'sample_module' %}">
                    <i class="bi bi-eyedropper me-1"></i>Sample Management
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'mdm' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'mdm_module' %}">
                    <i class="bi bi-database-check me-1"></i>Master Data (MDM)
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'instrument' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'instrument_module' %}">
                    <i class="bi bi-cpu me-1"></i>Instruments & Calibration
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if 'stability' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'stability_module' %}">
                    <i class="bi bi-hourglass-split me-1"></i>Stability Module
                </a>
            </li>
        </ul>
        <div class="d-flex align-items-center text-white">
            <span class="me-3"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</span>
            <a href="/admin/" class="btn btn-outline-warning btn-sm" target="_blank">Admin Module</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 mb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
